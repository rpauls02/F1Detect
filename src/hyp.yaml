# Learning Rate and Optimization
lr0: [1e-5, 1e-1]  # Suitable for transfer learning
momentum: [0.6, 0.98]  # Stabilizes training
weight_decay: [0.0, 0.001]  # Prevents overfitting

# Warmup Parameters
warmup_epochs: [0.0, 5.0]  # Ensures smooth weight initialization

# Augmentation Parameters
hsv_h: [0.0, 0.1]  # Hue variation
hsv_s: [0.0, 0.9]  # Saturation variation
hsv_v: [0.0, 0.9]  # Brightness variation
degrees: [0.0, 5.0]  # Small rotations
translate: [0.0, 0.9]  # Limited translations
scale: [0.0, 0.9]  # Minor scaling
fliplr: [0.0, 1.0]  # Horizontal flipping (useful for track-side shots)
mosaic: [0.0, 1.0]  # Essential for object detection

# Loss Function Weights
box: [0.02, 0.2]  # Focuses on accurate localization
cls: [0.2, 4.0]  # Maintains classification balance
